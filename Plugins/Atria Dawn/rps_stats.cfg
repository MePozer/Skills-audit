// Round & Player Statistics Manager - configuration
//
// Copy this file to addons/amxmodx/configs/rps_stats.cfg (the plugin also
// finds it next to itself in addons/amxmodx/plugins). Values shown here are
// the defaults, so the file is optional.

// Очки за убийство
rps_score_kill "100"

// Очки за заражение человека
rps_score_infect "50"

// Очки за убийство в голову
rps_score_headshot "25"

// Очки начисляются за каждые N единиц нанесённого урона (0 - урон не учитывается)
rps_score_damage_div "100"

// Минимальное число игроков, чтобы статистика раунда учитывалась в сессию
rps_min_players "4"

// 1 - сохранять статистику на диск (nvault) между картами, 0 - только карта
rps_save "1"

// 1 - показывать итоги раунда в чат
rps_announce_round_end "1"

// 1 - вести лог плагина (addons/amxmodx/logs/rps_stats.log)
rps_log "1"
